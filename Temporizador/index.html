<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temporizador de soga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#e9edf2;--surface:#fff;--text:#12161d;--muted:#59616e;--line:#d3d9e1;
--prep:#8a5a00;--action:#0b7a43;--rest:#1f56c4;--done:#6a3fc0;
--disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c0f14;--surface:#171b22;--text:#eef1f5;--muted:#98a1ae;--line:#2a303a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c0f14;--surface:#171b22;--text:#eef1f5;--muted:#98a1ae;--line:#2a303a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:30rem;margin:0 auto;padding:1rem}
h1{font:700 1.5rem/1.1 var(--disp);margin:.25rem 0 1rem;letter-spacing:.01em}
h2{font:700 1.3rem/1.1 var(--disp);margin:0 0 .5rem}
.timer{border:1px solid transparent;border-radius:20px;padding:1.5rem 1.25rem 1.25rem;text-align:center;color:#fff;background:var(--done);transition:background .3s}
body[data-phase=prep] .timer{background:var(--prep)}
body[data-phase=action] .timer{background:var(--action)}
body[data-phase=rest] .timer{background:var(--rest)}
body[data-phase=idle] .timer{background:var(--surface);color:var(--text);border-color:var(--line)}
.ph{font:700 clamp(2rem,9vw,2.75rem)/1 var(--disp)}
.time{font:700 clamp(6rem,34vw,9.5rem)/.95 var(--disp);font-variant-numeric:tabular-nums;margin:.5rem 0 .75rem}
.sub{min-height:2.9em;opacity:.92}
.track{height:10px;border-radius:5px;position:relative;overflow:hidden;margin-top:.25rem}
.track::before{content:"";position:absolute;inset:0;background:currentColor;opacity:.25}
#fill{position:absolute;inset:0 auto 0 0;width:0;background:currentColor}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:1rem 0 0;min-height:14px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;opacity:.45}
.dot.d{background:currentColor;opacity:.9}
.dot.c{background:currentColor;opacity:1;transform:scale(1.35)}
.ctrls{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:.6rem;margin-top:1.25rem}
button{font:inherit;font-weight:600;min-height:48px;border-radius:12px;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid currentColor;outline-offset:2px}
.primary{border-color:transparent;font-size:1.1rem;background:#fff;color:#12161d}
body[data-phase=idle] .primary{background:var(--text);color:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;margin-top:1rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.row label{font-weight:600}
.row small{color:var(--muted);font-weight:400;margin-left:.4rem}
.step{display:flex;gap:.4rem;align-items:center}
.step button{width:44px;min-height:44px;border:2px solid var(--line);font-size:1.3rem;line-height:1}
.step input{width:4.5rem;height:44px;text-align:center;font:700 1.6rem var(--disp);background:transparent;color:inherit;border:2px solid var(--line);border-radius:10px;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button,.step input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.snd{display:flex;gap:.6rem;align-items:center;margin-top:.8rem}
.snd input{width:20px;height:20px;accent-color:var(--action)}
.muted{color:var(--muted);margin:.6rem 0 0}
.banner{display:flex;gap:.75rem;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--prep);border-radius:12px;padding:.7rem .9rem;margin-bottom:1rem}
.banner[hidden]{display:none}
.banner button{min-height:40px;padding:0 .9rem;border-color:var(--line)}
.foot{color:var(--muted);font-size:.9rem;text-align:center;margin:1.25rem 0 .5rem}
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1rem}
.tb{display:flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;padding:0 .35rem;background:var(--surface);color:var(--text);border:2px solid var(--line);font-size:.88rem}
.tb svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb .x{display:none}
.tb[aria-pressed=true]{color:var(--muted);border-style:dashed;background:transparent}
.tb[aria-pressed=true] .x{display:inline}
dialog{width:min(92vw,24rem);border:1px solid var(--line);border-radius:16px;padding:0;background:var(--surface);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dbody{padding:1.25rem}
.dbtns{display:grid;gap:.6rem;margin-top:1rem}
.dbtns button{border-color:var(--line)}
.dbtns .dprim{background:var(--text);color:var(--surface);border-color:transparent}
@media (max-width:359px){.tb span{display:none}}
@media (prefers-reduced-motion:reduce){.timer{transition:none}}
</style>
</head>
<body data-phase="idle">
<main>
<div class="bar" role="group" aria-label="Silenciar">
  <button class="tb" id="mv" aria-pressed="false" aria-label="Silenciar voces" title="Silenciar voces"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/><path class="x" d="M3 3l18 18"/></svg><span>Voz</span></button>
  <button class="tb" id="ms" aria-pressed="false" aria-label="Silenciar sonidos" title="Silenciar sonidos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path class="x" d="M3 3l18 18"/></svg><span>Sonidos</span></button>
  <button class="tb" id="ma" aria-pressed="false" aria-label="Silenciar todo" title="Silenciar todo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path class="x" d="M3 3l18 18"/></svg><span>Todo</span></button>
</div>
<h1>Temporizador de soga</h1>
<div class="banner" id="banner" hidden><span id="bt"></span><button id="bd">Descartar</button></div>
<section class="timer" id="timer">
  <div class="ph" id="ph" aria-live="polite"></div>
  <div class="time" id="time"></div>
  <div class="sub" id="sub"></div>
  <div class="track"><div id="fill"></div></div>
  <div class="dots" id="dots"></div>
  <div class="ctrls">
    <button id="reset">Reiniciar</button>
    <button id="main" class="primary"></button>
    <button id="skip">Saltar</button>
  </div>
</section>
<section class="card">
  <h2>Configuración</h2>
  <div id="fields"></div>
  <label class="snd"><input type="checkbox" id="snd"> Sonidos y vibración</label>
  <label class="snd"><input type="checkbox" id="voz"> Voz: series, fases y cuenta regresiva</label>
  <p class="muted" id="total"></p>
</section>
<p class="foot">Tu progreso se guarda solo en este dispositivo. Si cerrás la página a mitad de sesión, la retomás en pausa.</p>
</main>
<dialog id="dlg" aria-labelledby="dh">
  <div class="dbody">
    <h2 id="dh">¿Qué querés reiniciar?</h2>
    <p class="muted" id="dtxt"></p>
    <div class="dbtns">
      <button id="dser" class="dprim"></button>
      <button id="dall">Reiniciar todo</button>
      <button id="dcan">Cancelar</button>
    </div>
  </div>
</dialog>
<script>
(()=>{
const $=id=>document.getElementById(id);
const ls={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
// [clave, etiqueta, unidad, min, max, paso]
const F=[["prep","Prepárate","seg",0,600,5],["action","Acción","seg",1,3600,5],["rest","Descanso","seg",0,3600,5],["series","Series","",1,200,1]];
const DEF={prep:10,action:60,rest:30,series:10};
const LABEL={idle:"Listo para empezar",prep:"Prepárate",action:"¡Saltá!",rest:"Descanso",done:"¡Terminaste!"};
const clamp=(k,v)=>{const f=F.find(x=>x[0]===k);v=Math.round(Number(v));if(!isFinite(v))v=DEF[k];return Math.min(f[4],Math.max(f[3],v))};
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const total=c=>c.prep+c.series*c.action+(c.series-1)*c.rest;

const cfg={...DEF,sound:true,voice:true,v:2};
const sc=ls.get("jr.cfg");
if(sc){F.forEach(f=>{cfg[f[0]]=clamp(f[0],sc.v===2?sc[f[0]]??DEF[f[0]]:DEF[f[0]])});cfg.sound=sc.sound!==false;cfg.voice=sc.voice!==false}

let S=null,iv=null,lastSec=0,ac=null,wl=null;

// Siguiente fase (salta las de duración 0). Después de la última acción termina, sin descanso final.
function nxt(p,i,c){
  do{
    if(p==="prep")p="action";
    else if(p==="action"){if(i>=c.series)return["done",i];p="rest"}
    else{p="action";i++}
  }while(c[p]<=0);
  return[p,i];
}
function totalLeft(){
  let t=S.remMs/1000,p=S.phase,i=S.idx;
  for(;;){[p,i]=nxt(p,i,S.cfg);if(p==="done")break;t+=S.cfg[p]}
  return t;
}

/* Audio, vibración y pantalla */
let master=null;
function prime(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createDynamicsCompressor();master.connect(ac.destination)}if(ac.state==="suspended")ac.resume()}catch(e){}}
// Nota con timbre más lleno: onda base + armónico una octava arriba, con ataque y caída suaves
function tone(f,at,d,type,v){
  const t=ac.currentTime+at,o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),g2=ac.createGain();
  o.type=type||"triangle";o.frequency.value=f;o2.type="sine";o2.frequency.value=f*2;g2.gain.value=.25;
  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(master);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.35,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05);
}
// Cada nota: [frecuencia, retraso, duración, tipo, volumen]
function notes(l){if(!cfg.sound)return;try{prime();l.forEach(n=>tone(n[0],n[1],n[2],n[3],n[4]))}catch(e){}}
function beep(f,d){notes([[f,0,d||.1,"sine",.3]])}
const NUM=["","uno","dos","tres","cuatro","cinco"];
const WORD={prep:"Prepárate",action:"Comienza",rest:"Descanso",done:"Terminaste"};
// Números en palabras (hasta 200, el máximo de series) para que la voz los pronuncie bien
const UN=["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve","veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis","veintisiete","veintiocho","veintinueve"];
const DEC=["","","","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
function numEs(n){
  if(n<30)return UN[n];
  if(n<100)return DEC[Math.floor(n/10)]+(n%10?" y "+UN[n%10]:"");
  if(n===100)return"cien";
  if(n<200)return"ciento "+numEs(n-100);
  return n===200?"doscientos":String(n);
}
let vt=null;
function hush(){clearTimeout(vt);try{if("speechSynthesis" in window)speechSynthesis.cancel()}catch(e){}}
function primeVoice(){try{if("speechSynthesis" in window){const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}}catch(e){}}
// Devuelve true si pudo hablar (si no hay voz en español, el llamador usa bips)
function say(t){
  if(!cfg.voice||!("speechSynthesis" in window))return false;
  try{
    const vs=speechSynthesis.getVoices();
    const v=vs.find(x=>/^es[-_]AR/i.test(x.lang))||vs.find(x=>/^es[-_](MX|US|419)/i.test(x.lang))||vs.find(x=>/^es/i.test(x.lang));
    if(vs.length&&!v)return false;
    const u=new SpeechSynthesisUtterance(t);
    if(v){u.voice=v;u.lang=v.lang}else u.lang="es-AR";
    u.rate=1.1;
    if(speechSynthesis.speaking)speechSynthesis.cancel();
    speechSynthesis.speak(u);
    return true;
  }catch(e){return false}
}
function cue(p){
  hush();
  vt=setTimeout(()=>say(p==="action"&&S?"Serie "+numEs(S.idx)+". "+WORD.action:WORD[p]),300);
  if(p==="prep")notes([[523,0,.2],[659,.16,.35]]);
  else if(p==="action")notes([[523,0,.12],[659,.08,.12],[784,.16,.12],[1047,.24,.7,"triangle",.45]]);
  else if(p==="rest")notes([[784,0,.25,"sine"],[587,.22,.55,"sine"]]);
  else if(p==="done")notes([[523,0,.2],[659,.16,.2],[784,.32,.2],[1047,.48,1,"triangle",.45],[784,.48,1,"sine",.3],[659,.48,1,"sine",.25]]);
  if(cfg.sound&&navigator.vibrate){try{navigator.vibrate(p==="done"?[200,100,200,100,400]:150)}catch(e){}}
}
async function keepAwake(){try{if("wakeLock" in navigator&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}}catch(e){}}
function letSleep(){try{wl&&wl.release()}catch(e){}wl=null;hush()}

/* Persistencia de la sesión */
function saveSession(){
  if(!S||S.phase==="done"){ls.del("jr.session");return}
  if(S.running)S.remMs=Math.max(0,S.endAt-Date.now());
  ls.set("jr.session",{cfg:S.cfg,phase:S.phase,idx:S.idx,remMs:S.remMs,at:Date.now()});
}

/* Control del temporizador */
function startNew(){
  const c={prep:cfg.prep,action:cfg.action,rest:cfg.rest,series:cfg.series};
  S={cfg:c,phase:"prep",idx:1,remMs:0,running:false,endAt:0};
  if(c.prep<=0)[S.phase,S.idx]=nxt("prep",1,c);
  S.remMs=c[S.phase]*1000;
  play();cue(S.phase);
}
function play(){
  S.running=true;S.endAt=Date.now()+S.remMs;lastSec=Math.ceil(S.remMs/1000);
  clearInterval(iv);iv=setInterval(tick,100);
  keepAwake();$("banner").hidden=true;render();saveSession();
}
function pause(){
  if(!S||!S.running)return;
  S.remMs=Math.max(0,S.endAt-Date.now());S.running=false;
  clearInterval(iv);letSleep();saveSession();render();
}
function finish(){
  S.phase="done";S.running=false;S.remMs=0;
  clearInterval(iv);letSleep();ls.del("jr.session");cue("done");render();
}
function tick(){
  if(!S||!S.running)return;
  const now=Date.now();let g=0;
  while(now>=S.endAt&&g++<300){
    const t=S.endAt;
    [S.phase,S.idx]=nxt(S.phase,S.idx,S.cfg);
    if(S.phase==="done"){finish();return}
    S.endAt=t+S.cfg[S.phase]*1000;
    lastSec=S.cfg[S.phase];
    cue(S.phase);
  }
  S.remMs=Math.max(0,S.endAt-now);
  const s=Math.ceil(S.remMs/1000);
  if(s!==lastSec){if(s>0&&s<=5&&!say(NUM[s])&&s<=3)beep(880,.1);lastSec=s;saveSession()}
  render();
}

/* Pantalla */
const fieldsEl=$("fields");
fieldsEl.innerHTML=F.map(([k,l,u])=>`<div class="row"><label for="i-${k}">${l}${u?`<small>${u}</small>`:""}</label><div class="step"><button data-k="${k}" data-d="-1" aria-label="Menos ${l}">−</button><input id="i-${k}" data-k="${k}" type="number" inputmode="numeric"><button data-k="${k}" data-d="1" aria-label="Más ${l}">+</button></div></div>`).join("");

function render(){
  const idle=!S,done=!!S&&S.phase==="done",active=!!S&&!done;
  const ph=idle?"idle":S.phase;
  document.body.dataset.phase=ph;
  $("ph").textContent=LABEL[ph];
  const c=idle?cfg:S.cfg;
  let pct=0;
  if(idle){
    $("time").textContent=fmt(total(cfg));
    $("sub").textContent="Duración total de "+cfg.series+(cfg.series===1?" serie.":" series.");
  }else if(done){
    pct=100;
    $("time").textContent=fmt(total(c));
    $("sub").textContent=c.series+(c.series===1?" serie completada.":" series completadas.")+" Este fue tu tiempo total.";
  }else{
    pct=(1-S.remMs/(c[ph]*1000))*100;
    $("time").textContent=fmt(Math.ceil(S.remMs/1000));
    $("sub").textContent=(S.running?"":"En pausa. ")+"Serie "+S.idx+" de "+c.series+". Quedan "+fmt(Math.ceil(totalLeft()))+" en total.";
  }
  $("fill").style.width=Math.min(100,Math.max(0,pct))+"%";
  $("dots").innerHTML=!idle&&c.series<=40?Array.from({length:c.series},(_,n)=>{
    const i=n+1;return`<span class="dot${done||i<S.idx?" d":i===S.idx?" c":""}"></span>`}).join(""):"";
  $("main").textContent=idle?"Iniciar":done?"Repetir":S.running?"Pausar":"Continuar";
  $("reset").disabled=idle;
  $("skip").disabled=!active;
  fieldsEl.querySelectorAll("button,input").forEach(e=>{e.disabled=active});
  F.forEach(([k])=>{const el=$("i-"+k);if(document.activeElement!==el)el.value=cfg[k]});
  $("snd").checked=cfg.sound;$("voz").checked=cfg.voice;
  $("mv").setAttribute("aria-pressed",String(!cfg.voice));$("ms").setAttribute("aria-pressed",String(!cfg.sound));$("ma").setAttribute("aria-pressed",String(!cfg.sound&&!cfg.voice));
  $("total").textContent="Duración total: "+fmt(total(cfg))+" ("+cfg.series+" × "+cfg.action+" s de acción"+(cfg.series>1?", "+(cfg.series-1)+" × "+cfg.rest+" s de descanso":"")+").";
}

/* Eventos */
$("main").onclick=()=>{
  prime();primeVoice();
  if(!S||S.phase==="done")startNew();
  else if(S.running)pause();else play();
};
$("skip").onclick=()=>{
  if(!S||S.phase==="done")return;
  [S.phase,S.idx]=nxt(S.phase,S.idx,S.cfg);
  if(S.phase==="done"){finish();return}
  S.remMs=S.cfg[S.phase]*1000;
  if(S.running)S.endAt=Date.now()+S.remMs;
  lastSec=S.cfg[S.phase];cue(S.phase);saveSession();render();
};
function reset(){clearInterval(iv);letSleep();S=null;ls.del("jr.session");$("banner").hidden=true;render()}
$("reset").onclick=askReset;
// Reiniciar: pregunta si es todo o solo la serie actual (el temporizador queda en pausa mientras decidís)
const dlg=$("dlg");let wasRunning=false,choice=null;
function askReset(){
  if(!S)return;
  if(S.phase==="done"||typeof dlg.showModal!=="function"){reset();return}
  wasRunning=S.running;pause();
  const prep=S.phase==="prep";
  $("dtxt").textContent=(prep?"Estás en la cuenta previa.":"Estás en la serie "+S.idx+" de "+S.cfg.series+".")+" Podés volver al inicio de "+(prep?"la preparación":"esta serie")+" o empezar la sesión desde cero.";
  $("dser").textContent=prep?"Reiniciar la preparación":"Reiniciar la serie actual";
  dlg.showModal();
}
function restartSeries(){
  if(S.phase!=="prep")S.phase="action";
  S.remMs=S.cfg[S.phase]*1000;lastSec=S.cfg[S.phase];
  $("banner").hidden=true;
  if(wasRunning){cue(S.phase);play()}else{saveSession();render()}
}
function closeDlg(c){choice=c;dlg.close()}
$("dser").onclick=()=>closeDlg("series");
$("dall").onclick=()=>closeDlg("all");
$("dcan").onclick=()=>closeDlg(null);
dlg.addEventListener("click",e=>{if(e.target===dlg)closeDlg(null)});
dlg.addEventListener("close",()=>{
  const c=choice;choice=null;
  if(!S)return;
  if(c==="all")reset();
  else if(c==="series")restartSeries();
  else if(wasRunning)play();
});
$("bd").onclick=reset;
fieldsEl.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const k=b.dataset.k,f=F.find(x=>x[0]===k);
  cfg[k]=clamp(k,cfg[k]+Number(b.dataset.d)*f[5]);
  ls.set("jr.cfg",cfg);render();
});
fieldsEl.addEventListener("input",e=>{
  const k=e.target.dataset.k;if(!k)return;
  const v=parseInt(e.target.value,10);
  if(isFinite(v)){cfg[k]=clamp(k,v);ls.set("jr.cfg",cfg);render()}
});
fieldsEl.addEventListener("change",e=>{const k=e.target.dataset.k;if(k)e.target.value=cfg[k]});
$("snd").onchange=e=>{cfg.sound=e.target.checked;ls.set("jr.cfg",cfg);render();if(cfg.sound)notes([[784,0,.15],[1047,.12,.3]])};
$("voz").onchange=e=>{cfg.voice=e.target.checked;ls.set("jr.cfg",cfg);render();if(cfg.voice)say("Comienza");else hush()};
// Botones de arriba: silenciar voz, sonidos o todo (presionado = silenciado)
function setAudio(sound,voice){
  cfg.sound=sound;cfg.voice=voice;ls.set("jr.cfg",cfg);
  if(!voice)hush();
  if(sound)prime();
  render();
}
$("mv").onclick=()=>setAudio(cfg.sound,!cfg.voice);
$("ms").onclick=()=>setAudio(!cfg.sound,cfg.voice);
$("ma").onclick=()=>{const off=!cfg.sound&&!cfg.voice;setAudio(off,off)};
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)saveSession();
  else if(S&&S.running){tick();keepAwake()}
});
addEventListener("pagehide",saveSession);

/* Retomar sesión guardada */
const ss=ls.get("jr.session");
if(ss&&ss.cfg&&["prep","action","rest"].includes(ss.phase)&&isFinite(ss.remMs)&&ss.idx>=1){
  const c={};F.forEach(f=>{c[f[0]]=clamp(f[0],ss.cfg[f[0]])});
  if(ss.idx<=c.series&&c[ss.phase]>0){
    S={cfg:c,phase:ss.phase,idx:ss.idx,remMs:Math.min(Math.max(0,ss.remMs),c[ss.phase]*1000),running:false,endAt:0};
    $("bt").textContent="Tenés una sesión a la mitad: serie "+S.idx+" de "+c.series+", "+LABEL[S.phase].toLowerCase().replace(/[¡!]/g,"")+", quedan "+fmt(Math.ceil(S.remMs/1000))+".";
    $("banner").hidden=false;
  }
}
render();
})();
</script>
</body>
</html>
